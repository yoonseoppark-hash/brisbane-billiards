<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-title" content="브리즈번당구"><title>브리즈번당구</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#18334e;font:16px system-ui}main{max-width:1200px;margin:auto;padding:14px}header,footer,.stats,.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:20px;margin:0}button,input,select{font:inherit;padding:12px;border:1px solid #ccd8e5;border-radius:10px;background:white;color:inherit}button{cursor:pointer;touch-action:manipulation;font-weight:bold}button:disabled{opacity:.35}.board{display:flex;gap:12px;margin:15px 0}.player{flex:1;min-width:0;text-align:center;background:#ffffff;color:#18334e;border:3px solid transparent;border-radius:20px;padding:12px}.player:nth-child(2){background:#ffd93d;color:#2b280f}.player:nth-child(3){background:#d7f0de}.active{border-color:#16835d}.score{font-size:clamp(64px,16vw,180px);font-weight:900;line-height:1.1;cursor:pointer}.stats{justify-content:space-around;margin:12px 0}.stats small{display:block}.controls button{flex:1}.primary{background:#2465a9;color:white;flex:2}.clock{background:white;padding:12px;border-radius:12px;text-align:center;flex:1}.clock b{display:block;font-size:26px}dialog{border:0;border-radius:16px;max-width:95vw;width:520px;color:#18334e}dialog::backdrop{background:#18334e88}label{display:block;margin:8px 0}input,select{max-width:100%}progress{width:100%;accent-color:#23815f}#status{text-align:center;min-height:25px}pre{white-space:pre-wrap} @media(orientation:landscape){.score{font-size:clamp(60px,23vh,160px)} .player{padding:8px}}.player-name{background:transparent;border:0;padding:8px 0;font:inherit;font-weight:inherit;width:100%;color:inherit}.player-name:disabled{opacity:1;cursor:default}.player{cursor:pointer}.player:has(.score:hover){cursor:pointer}.player .controls button{cursor:pointer}.member-grid{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;max-height:180px;overflow:auto}.member-grid input{width:82px;padding:7px}.hint{font-size:12px;color:#536b80;margin:7px 0}.name-row{display:flex;gap:6px;flex-wrap:wrap}.name-row select{flex:1;min-width:145px}.name-row input{flex:1;min-width:110px}</style><main><header><h1>🎱 BRISBANE BILLIARDS</h1><button onclick="settings()">⚙ 설정</button></header><p id="meta"></p><div class="board" id="board"></div><div id="status"></div><div class="stats"><div class="clock">이닝<b id="inn"></b></div><div class="clock">샷클락<b id="shot"></b></div><div class="clock">경기 시간<b id="time"></b></div></div><div class="controls"><button onclick="undo()">↶ 취소</button><button class="primary" onclick="next()">턴 넘기기 →</button></div><p class="controls"><button onclick="toggle()" id="play">시작</button><button onclick="resetShot()">샷 리셋</button><button onclick="sound()" id="sound">음성 OFF</button><button onclick="full()">전체화면</button></p><footer><button onclick="result()">경기 결과 / 종료</button><button onclick="records()">지난 기록</button></footer></main><dialog id="setup"><h2>새 경기 설정</h2><label>종목 <select id="kind"><option>3쿠션</option><option>4구</option></select></label><label>구분 <select id="league"><option>친선경기</option><option>공식경기</option></select></label><label>당구대 <select id="table"><option>중대 1번</option><option>중대 2번</option><option>대대</option></select></label><label>방식 <select id="mode" onchange="fields()"><option value="2">2인전</option><option value="3">3인전</option><option value="team">2:2 팀전</option></select></label><div id="fields"></div><details><summary>회원별 기본 핸디 설정</summary><p class="hint">핸디를 수정하면 이 브라우저에 저장되고 다음 경기 선수 선택 시 자동 입력됩니다. 구글 시트와 실시간 연동되지는 않습니다.</p><div class="member-grid" id="memberGrid"></div><button type="button" onclick="saveMembers()">핸디 저장</button></details><label>샷클락 <select id="limit"><option>40</option><option>30</option><option>60</option><option value="0">0</option></select></label><label>한국어 음성 <select id="voice"></select></label><button onclick="newGame()">새 경기 시작</button> <button onclick="setup.close()">닫기</button></dialog><dialog id="out"><h2>경기 기록</h2><pre id="report"></pre><button id="finish" onclick="finish()">종료 및 저장</button> <button onclick="download()">JSON 내보내기</button> <button onclick="out.close()">닫기</button></dialog><script>
const $=id=>document.getElementById(id), roster={Leo:'레오',Jack:'잭',Brian:'브라이언',Steve:'스티브',Hank:'행크',Ian:'이안',Jo:'조',Sion:'시온'};let handicaps={Leo:17,Jack:18,Brian:22,Steve:10,Hank:21,Ian:22,Jo:22,Sion:17};try{Object.assign(handicaps,JSON.parse(localStorage.bbHandicaps||'{}'))}catch(e){};let cfg={kind:'3쿠션',league:'친선경기',table:'중대 1번',mode:'2',limit:40,names:['Leo','Jack'],pron:['레오','잭'],goals:[17,18],voice:''},s,h=[],saved=[],audio=false,running=false;function fresh(){return {id:Date.now().toString(),p:cfg.names.map(()=>0),i:cfg.names.map(()=>0),hr:cfg.names.map(()=>0),a:0,r:0,shot:cfg.limit,time:0,done:false}}s=fresh();try{let x=JSON.parse(localStorage.bbState||'null');if(x){cfg=x.cfg;s=x.s;h=x.h||[];audio=x.audio}saved=JSON.parse(localStorage.bbRecords||'[]')}catch(e){}function persist(){try{localStorage.bbState=JSON.stringify({cfg,s,h,audio});localStorage.bbRecords=JSON.stringify(saved)}catch(e){}}function snap(){h.push(JSON.stringify(s));if(h.length>200)h.shift()}function num(n){let a=['영','일','이','삼','사','오','육','칠','팔','구'];return n<10?a[n]:n<100?(n>=20?a[Math.floor(n/10)]: '')+'십'+(n%10?a[n%10]:''):String(n)}function speak(t){if(!audio)return;try{let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.88;let v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko'));u.voice=v.find(v=>v.name===cfg.voice)||v.find(v=>/Yuna|유나|female/i.test(v.name))||v[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}function avg(j){let n=s.i[j]+(!s.done&&s.a===j&&s.r>0?1:0);return n?(s.p[j]/n).toFixed(3):'0.000'}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){ $('meta').textContent=[cfg.kind,cfg.table,cfg.league].join(' · ');$('board').innerHTML=cfg.names.map((n,j)=>`<section class="player ${s.a===j&&!s.done?'active':''}" onclick="cardTurn(event,${j})"><small>${s.a===j&&!s.done?'● 공격 중':'대기'}</small><h2><button class="player-name" onclick="event.stopPropagation();nameTurn(${j})">${esc(n)}</button></h2><div class="score" onclick="event.stopPropagation();s.a===${j}?score(${j},1):nameTurn(${j})">${s.p[j]}</div><div>목표 ${cfg.goals[j]} · ${Math.max(0,cfg.goals[j]-s.p[j])}점 남음</div><progress max="${cfg.goals[j]}" value="${s.p[j]}"></progress><div class="stats"><div><small>AVG</small><b>${avg(j)}</b></div><div><small>HR</small><b>${Math.max(s.hr[j],s.a===j?s.r:0)}</b></div><div><small>INN</small><b>${s.i[j]}</b></div></div><div class="controls">${[-1,1,2].map(d=>`<button ${s.done||s.a!==j?'disabled':''} onclick="score(${j},${d})">${d>0?'+':''}${d}</button>`).join('')}</div></section>`).join('');$('status').textContent=s.done?'경기 종료':cfg.names[s.a]+' · 연속 '+s.r+'점'+(s.p[s.a]>=cfg.goals[s.a]?' · 목표 달성!':'');$('inn').textContent=Math.min(...s.i)+(s.done?0:1);$('sound').textContent='음성 '+(audio?'ON':'OFF');$('play').textContent=running?'일시정지':'시작';clocks();persist()}function clocks(){$('shot').textContent=cfg.limit?s.shot:'—';$('time').textContent=[Math.floor(s.time/60),s.time%60].map(x=>String(x).padStart(2,'0')).join(':')}function score(j,d){if(s.done||s.a!==j)return;if(d<0&&s.p[j]<=0)return;snap();s.p[j]=Math.max(0,s.p[j]+d);if(d>0)s.r+=d;s.shot=cfg.limit;if(d>0)speak(num(s.r)+' 점.');render()}function nameTurn(j){if(!s.done&&j===(s.a+1)%cfg.names.length)next()}function cardTurn(ev,j){if(ev.target.closest('.controls'))return;nameTurn(j)}function next(){if(s.done)return;snap();let r=s.r;s.i[s.a]++;s.hr[s.a]=Math.max(s.hr[s.a],r);s.r=0;s.a=(s.a+1)%cfg.names.length;s.shot=cfg.limit;speak(cfg.pron[s.a]+' 차례입니다.');render()}function undo(){if(h.length&&!s.done){s=JSON.parse(h.pop());render()}}function resetShot(){s.shot=cfg.limit;render()}let lock;async function toggle(){if(s.done)return;running=!running;if(running)try{lock=await navigator.wakeLock.request('screen')}catch(e){}else if(lock)lock.release();render()}function sound(){audio=!audio;if(audio)speak('음성 안내 시작.');render()}function full(){if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else alert('홈 화면에 추가하면 앱 형태로 사용할 수 있습니다.')}function memberOptions(current){let options='<option value="">선수 선택</option>'+Object.keys(roster).map(n=>`<option value="${esc(n)}" ${n===current?'selected':''}>${esc(n)}</option>`).join('')+'<option value="__guest" '+(!roster[current]?'selected':'')+'>직접 입력 / 게스트</option>';return options}
function fields(){let m=$('mode').value;let n=m==='3'?3:2;$('fields').innerHTML=Array.from({length:n},(_,j)=>{let name=cfg.names[j]||'';let known=!!roster[name];return `<label>선수 / 팀 ${j+1}<div class="name-row"><select id="pick${j}" onchange="pickMember(${j})">${memberOptions(name)}</select><input id="n${j}" aria-label="선수 이름 직접 입력" placeholder="게스트 / 팀 이름" value="${known?'':esc(name)}" style="display:${known?'none':'block'}"></div><input id="v${j}" aria-label="한글 발음" placeholder="한글 발음" value="${esc(cfg.pron[j]||roster[name]||name)}"><input id="g${j}" aria-label="목표 핸디 점수" type="number" min="1" value="${known?handicaps[name]:(cfg.goals[j]||20)}"></label>`}).join('');}
function pickMember(j){let name=$('pick'+j).value;let custom=$('n'+j);custom.style.display=name==='__guest'||!name?'block':'none';if(roster[name]){$('v'+j).value=roster[name];$('g'+j).value=handicaps[name]||20}else{custom.value='';$('v'+j).value='';$('g'+j).value=20}}
function memberEditor(){$('memberGrid').innerHTML=Object.keys(roster).map(n=>`<label for="hc${n}">${esc(n)}</label><input id="hc${n}" type="number" min="1" value="${handicaps[n]||20}">`).join('')}
function saveMembers(){Object.keys(roster).forEach(n=>handicaps[n]=Math.max(1,Math.floor(+$('hc'+n).value||20)));localStorage.bbHandicaps=JSON.stringify(handicaps);for(let j=0;j<(+$('mode').value||2);j++){let pick=$('pick'+j);if(pick&&roster[pick.value])$('g'+j).value=handicaps[pick.value]}alert('회원 핸디를 저장했어요. 다음 경기부터 자동 반영됩니다.')}
function settings(){for(let k of ['kind','league','table','mode','limit'])$(k).value=cfg[k];$('voice').replaceChildren(new Option('기본 한국어',''));try{speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko')).forEach(v=>$('voice').add(new Option(v.name,v.name)))}catch(e){}$('voice').value=cfg.voice;fields();memberEditor();$('setup').showModal()}
function newGame(){if(!s.done&&s.p.some(Boolean)&&!confirm('현재 경기를 지울까요?'))return;for(let k of ['kind','league','table','mode','voice'])cfg[k]=$(k).value;cfg.limit=+$('limit').value;let n=cfg.mode==='3'?3:2;cfg.names=Array.from({length:n},(_,j)=>{let picked=$('pick'+j).value;return roster[picked]?picked:($('n'+j).value.trim()||'Player '+(j+1))});cfg.pron=cfg.names.map((v,j)=>$('v'+j).value.trim()||roster[v]||v);cfg.goals=cfg.names.map((v,j)=>Math.max(1,Math.floor(+$('g'+j).value||20)));s=fresh();h=[];running=false;$('setup').close();render()}function data(){return {id:s.id,date:new Date().toISOString(),kind:cfg.kind,league:cfg.league,table:cfg.table,mode:cfg.mode,seconds:s.time,players:cfg.names.map((name,j)=>({name,goal:cfg.goals[j],score:s.p[j],innings:s.i[j],average:avg(j),highRun:Math.max(s.hr[j],s.a===j?s.r:0)})),winner:cfg.names.filter((n,j)=>s.p[j]>=cfg.goals[j])}}function result(){$('report').textContent=JSON.stringify(data(),null,2);$('finish').hidden=s.done;$('out').showModal()}function finish(){if(s.done)return;if(!confirm('경기를 종료하고 저장할까요?'))return;if(s.r>0){s.i[s.a]++;s.hr[s.a]=Math.max(s.hr[s.a],s.r)}s.r=0;s.done=true;running=false;saved.unshift(data());speak('경기가 종료되었습니다.');render();$('report').textContent=JSON.stringify(saved[0],null,2);$('finish').hidden=true}function records(){$('report').textContent=saved.length?JSON.stringify(saved,null,2):'저장된 경기 없음';$('finish').hidden=true;$('out').showModal()}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved.length?saved:[data()],null,2)],{type:'application/json'}));a.download='billiards-records.json';a.click()}setInterval(()=>{if(running&&!s.done){s.time++;if(s.shot>0){s.shot--;if(s.shot===10)speak('십 초 남았습니다.');if(s.shot===0)speak('시간 초과입니다.')}clocks();persist()}},1000);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
