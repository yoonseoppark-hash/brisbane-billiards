 handicapLoading=true;status('핸디 불러오는 중');

function queueRead(){try{return JSON.parse(localStorage.bbSyncQueue||'[]')}catch(e){return []}}
let syncing=false;
async function retrySync(){if(syncing)return;let q=queueRead();if(!q.length)return;let token=localStorage.bbSyncToken;if(!token){setSyncToken();token=localStorage.bbSyncToken}if(!token)return;syncing=true;let blocked=0,savedCount=0,errors=[];try{for(const m of q){try{if(m.practice){localStorage.bbSyncQueue=JSON.stringify(queueRead().filter(x=>x.syncId!==m.syncId));continue}let res=await fetch(syncURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'save',token,matchId:m.syncId,match:m})});let ans=await res.json();if(ans.blocked===true&&ans.matchId===m.syncId){localStorage.bbSyncQueue=JSON.stringify(queueRead().filter(x=>x.syncId!==m.syncId));blocked++;continue}if(!ans.ok||ans.matchId!==m.syncId||!(ans.version===8&&(ans.saved===true||(ans.duplicate===true))))throw Error(ans.message||'실제 저장 확인 응답이 아닙니다. v8 Apps Script 배포를 확인하세요.');localStorage.bbSyncQueue=JSON.stringify(queueRead().filter(x=>x.syncId!==m.syncId));localStorage.setItem('bbLiveSent:'+m.id,m.syncId);localStorage.removeItem('bbSent:'+m.id);savedCount++}catch(e){errors.push(e.message)}}if(errors.length)alert('저장 '+savedCount+'건 / 전송 실패 '+errors.length+'건: '+errors.join('; '));else if(blocked&&savedCount)alert('실제 저장 '+savedCount+'건 완료. 이전 테스트 '+blocked+'건은 제외했어요. 앱에서 삭제할 수 있습니다.');else if(blocked)alert('이전 미리보기 테스트 '+blocked+'건은 시트에 반영하지 않고 전송 대기에서 제외했어요. 앱에서 삭제할 수 있습니다.');else alert('구글시트 실제 저장 완료')}catch(e){alert('전송 확인 실패. 기기에 보관했어요. 연결 후 재시도하세요. '+e.message)}finally{syncing=false;connectionStatus();if(!$('historyFilter').hidden)drawHistory()}}
async function syncMatch(){return sendRecord(saved.find(x=>x.id===s.id))}async function syncRecord(i){await sendRecord(saved[i]);records()}async function sendRecord(m){if(!m||m.practice)return;if(localStorage.getItem('bbLiveSent:'+m.id)){alert('이미 실제 구글시트에 저장된 경기입니다.');return}if(m.winner.length!==1){alert('승자가 한 명인 경기만 전송할 수 있습니다.');return}let q=queueRead();if(!q.some(x=>x.id===m.id)){if(!confirm('이 경기 결과를 구글시트에 전송할까요?'))return;q.push({...m,syncId:m.id});localStorage.bbSyncQueue=JSON.stringify(q)}await retrySync()}
function connectionStatus(){let el=$('connection');if(el)el.textContent=(navigator.onLine?'온라인':'오프라인')+' · 미전송 '+saved.filter(m=>!m.practice&&recordStatus(m)!=='전송완료').length+'건'}window.addEventListener('offline',connectionStatus);window.addEventListener('online',()=>{connectionStatus();refreshHandicaps()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake()});window.addEventListener('online',()=>{if(queueRead().length&&localStorage.bbSyncToken)retrySync()});
setInterval(()=>{if(running&&!s.done&&!complete()){s.time++;if(s.shot>0){s.shot--;if(s.shot===10)speak('십 초 남았습니다.');if(s.shot===0)speak('시간 초과입니다.')}clocks();persist()}},1000);render();refreshHandicaps();new MutationObserver(()=>translateUI()).observe(document.body,{childList:true,subtree:true,characterData:true});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js?v=47',{updateViaCache:'none'}).catch(()=>{});
