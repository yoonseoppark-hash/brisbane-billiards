const $=id=>document.getElementById(id), roster={Leo:'레오',Jack:'잭',Brian:'브라이언',Steve:'스티브',Hank:'행크',Ian:'이안',Jo:'조',Sion:'시온'};let handicaps={Leo:17,Jack:18,Brian:22,Steve:10,Hank:21,Ian:22,Jo:22,Sion:17};try{Object.assign(handicaps,JSON.parse(localStorage.bbHandicaps||'{}'))}catch(e){};let cfg={firstBall:'white',kind:'3쿠션',league:'친선경기',table:'중대 1번',mode:'2',limit:40,names:['Leo','Jack'],pron:['레오','잭'],goals:[17,18],voice:''},s,h=[],saved=[],audio=false,running=false;function fresh(){return {id:crypto.randomUUID(),p:cfg.names.map(()=>0),i:cfg.names.map(()=>0),hr:cfg.names.map(()=>0),a:0,r:0,shot:cfg.limit,time:0,done:false,rank:[],turn:0}}s=fresh();try{let x=JSON.parse(localStorage.bbState||'null');if(x){cfg=x.cfg;s=x.s;h=x.h||[];audio=x.audio}saved=JSON.parse(localStorage.bbRecords||'[]')}catch(e){}function persist(){try{localStorage.bbState=JSON.stringify({cfg,s,h,audio});localStorage.bbRecords=JSON.stringify(saved)}catch(e){}}function snap(){h.push(JSON.stringify(s));if(h.length>200)h.shift()}function num(n){let a=['영','일','이','삼','사','오','육','칠','팔','구'];return n<10?a[n]:n<100?(n>=20?a[Math.floor(n/10)]: '')+'십'+(n%10?a[n%10]:''):String(n)}function speak(t){if(!audio)return;try{let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.88;let v=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('ko'));u.voice=v.find(v=>v.name===cfg.voice)||v.find(v=>/Yuna|유나|female/i.test(v.name))||v[0]||null;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}function avg(j){let n=s.i[j]+(!s.done&&s.a===j&&s.r>0?1:0);return n?(s.p[j]/n).toFixed(3):'0.000'}function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ranks(){return s.rank||(s.rank=[])}function multi(){return cfg.names.length>=3}function complete(){return multi()?ranks().length===cfg.names.length:cfg.names.some((_,j)=>s.p[j]>=cfg.goals[j])}function nextPlayer(){for(let k=1;k<=cfg.names.length;k++){let j=(s.a+k)%cfg.names.length;if(!ranks().includes(j))return j}return s.a}function ballColor(j){let order=[];for(let k=0;k<cfg.names.length;k++){let x=(s.a+k)%cfg.names.length;if(!ranks().includes(x))order.push(x)}let offset=order.indexOf(j);if(offset<0)return '#d7f0de';let turn=s.turn??s.i.reduce((a,b)=>a+b,0);return ((turn+offset+(cfg.firstBall==='yellow'?1:0))%2===0)?'#ffffff':'#ffd93d'} function isTeam(m){return ['team','team222','team33'].includes(m)}function teamCount(m=cfg.mode){return m==='team222'?3:2}function teamSize(m=cfg.mode){return m==='team33'?3:2}function teamMode(){return isTeam(cfg.mode)&&cfg.members?.length===teamCount()*teamSize()}function shooterFor(t){return t*teamSize()+s.i[t]%teamSize()}function teamTap(j,point){if(s.done||complete())return;let current=shooter();if(ranks().includes(Math.floor(j/teamSize())))return;if(j===current&&point)score(s.a,1);else if(j!==current)nextTurnTeam()}function nextTurnTeam(){next()}function teamBoard(){let colors=cfg.names.map((_,t)=>ballColor(t)),ps=individualData(),n=teamCount(),z=teamSize();return cfg.names.map((_,t)=>t).map(t=>'<div class="team-total" style="background:'+colors[t]+'">'+['A팀','B팀','C팀'][t]+'<b>'+s.p[t]+' / '+cfg.goals[t]+'</b><progress max="'+cfg.goals[t]+'" value="'+s.p[t]+'"></progress></div>').join('')+Array.from({length:n*z},(_,k)=>(k%n)*z+Math.floor(k/n)).map(j=>{let t=Math.floor(j/teamSize()),a=shooter()===j&&!s.done&&!complete(),up=!s.done&&!complete()&&j===shooterFor(nextPlayer()),p=ps[j];return '<section class="player team-player '+(a?'active':up?'upnext':'')+'" style="background:'+colors[t]+'" onclick="teamTap('+j+',false)"><small>'+(a?'● 공격 중':up?'다음 차례':ranks().includes(t)?(ranks().indexOf(t)+1)+'위 · 종료':['A팀','B팀','C팀'][t]+' '+(j%z+1)+'번')+'</small><h2>'+esc(p.name)+'</h2><div class="score" onclick="event.stopPropagation();teamTap('+j+',true)">'+p.score+'</div><div class="stats"><div><small>AVG</small><b>'+p.average+'</b></div><div><small>HR</small><b>'+p.highRun+'</b></div><div><small>INN</small><b>'+p.innings+'</b></div></div><div class="controls" onclick="event.stopPropagation()">'+[-1,1,2].map(d=>'<button '+(a?'':'disabled')+' onclick="score('+t+','+d+')">'+(d>0?'+':'')+d+'</button>').join('')+'</div></section>'}).join('')}function render(){$('board').style.display=cfg.names.length>3?'grid':'flex';$('board').style.gridTemplateColumns='repeat(3,minmax(0,1fr))'; $('meta').textContent=[cfg.kind,cfg.table,cfg.league].join(' · ')+' · v22';$('board').innerHTML=cfg.names.map((n,j)=>`<section class="player ${s.a===j&&!s.done&&!complete()?'active':!s.done&&!complete()&&j===nextPlayer()?'upnext':''}" style="background:${ballColor(j)};color:#18334e" onclick="cardTurn(event,${j})"><small>${ranks().includes(j)?(ranks().indexOf(j)+1)+'위 · 종료':s.a===j&&!s.done?'● 공격 중':!s.done&&!complete()&&j===nextPlayer()?'다음 차례':'대기'}</small><h2><button class="player-name" onclick="event.stopPropagation();nameTurn(${j})">${esc(n)}</button></h2><div class="score" onclick="event.stopPropagation();s.a===${j}?score(${j},1):nameTurn(${j})">${s.p[j]}</div><div>목표 ${cfg.goals[j]} · ${Math.max(0,cfg.goals[j]-s.p[j])}점 남음</div><progress max="${cfg.goals[j]}" value="${s.p[j]}"></progress><div class="stats"><div><small>AVG</small><b>${avg(j)}</b></div><div><small>HR</small><b>${Math.max(s.hr[j],s.a===j?s.r:0)}</b></div><div><small>INN</small><b>${s.i[j]}</b></div></div><div class="controls">${[-1,1,2].map(d=>`<button ${s.done||s.a!==j||ranks().includes(j)?'disabled':''} onclick="score(${j},${d})">${d>0?'+':''}${d}</button>`).join('')}</div></section>`).join('');if(teamMode()){$('board').style.display='grid';$('board').style.gridTemplateColumns='repeat('+teamCount()+',minmax(0,1fr))';$('board').innerHTML=teamBoard()}$('status').textContent=s.done||ranks().length===cfg.names.length?'경기 종료 · 순위 확정':(teamMode()?cfg.members[shooter()]:cfg.names[s.a])+' · 연속 '+s.r+'점'+(s.p[s.a]>=cfg.goals[s.a]?' · 목표 달성!':'');$('inn').textContent=Math.min(...s.i)+(s.done?0:1);$('sound').textContent='음성 '+(audio?'ON':'OFF');$('play').textContent=running?'일시정지':'시작';clocks();persist()}function clocks(){$('shot').textContent=cfg.limit?s.shot:'—';$('time').textContent=[Math.floor(s.time/60),s.time%60].map(x=>String(x).padStart(2,'0')).join(':')}function score(j,d){if(s.done||complete()||s.a!==j||ranks().includes(j))return;if(d<0&&(s.p[j]<=0||(teamMode()&&teamStats()[shooter()].score<=0)))return;snap();let old=s.p[j];s.p[j]=Math.max(0,Math.min(cfg.goals[j],old+d));if(teamMode())teamStats()[shooter()].score+=s.p[j]-old;if(d>0||teamMode())s.r=Math.max(0,s.r+s.p[j]-old);s.shot=cfg.limit;if(d>0)speak(num(s.r)+' 점.');if(multi()&&s.p[j]>=cfg.goals[j]){s.p[j]=cfg.goals[j];teamEnd();s.i[j]++;s.hr[j]=Math.max(s.hr[j],s.r);s.r=0;ranks().push(j);if(ranks().length===cfg.names.length-1){ranks().push(cfg.names.findIndex((_,k)=>!ranks().includes(k)))}if(ranks().length===cfg.names.length){running=false;speak('모든 선수의 경기가 종료되었습니다.');render();result()}else{s.a=nextPlayer();s.turn=(s.turn??(s.i.reduce((a,b)=>a+b,0)-1))+1;speak(cfg.pron[s.a]+' 차례입니다.')}}render();if(!multi()&&complete()){running=false;result()}}function nameTurn(j){if(!s.done&&j!==s.a&&!ranks().includes(j))next()}function cardTurn(ev,j){if(ev.target.closest('.controls'))return;nameTurn(j)}function next(){if(s.done||complete())return;snap();let r=s.r;teamEnd();s.i[s.a]++;s.hr[s.a]=Math.max(s.hr[s.a],r);s.r=0;s.a=nextPlayer();s.turn=(s.turn??(s.i.reduce((a,b)=>a+b,0)-1))+1;s.shot=cfg.limit;speak((teamMode()?(roster[cfg.members[shooter()]]||cfg.members[shooter()]):cfg.pron[s.a])+' 차례입니다.');render()}function undo(){if(h.length&&!s.done){s=JSON.parse(h.pop());render()}}function resetShot(){s.shot=cfg.limit;render()}let lock;async function toggle(){if(s.done||ranks().length===cfg.names.length)return;running=!running;if(running)try{lock=await navigator.wakeLock.request('screen')}catch(e){}else if(lock)lock.release();render()}function sound(){audio=!audio;if(audio)speak('음성 안내 시작.');render()}function full(){if(navigator.standalone===true||matchMedia('(display-mode: standalone)').matches)return;if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();else return}function memberOptions(current){let options='<option value="">선수 선택</option>'+Object.keys(roster).map(n=>`<option value="${esc(n)}" ${n===current?'selected':''}>${esc(n)}</option>`).join('')+'<option value="__guest" '+(!roster[current]?'selected':'')+'>직접 입력 / 게스트</option>';return options}
function fineDefaults(mode,league){let n=isTeam(mode)?teamCount(mode):+mode||2;return Array.from({length:n},(_,j)=>j===0?0:league==='공식경기'?5:n===2?10:n===3?j*5:0)}function fineFields(){let mode=$('mode').value,league=$('league').value;let values=fineDefaults(mode,league);$('fineFields').innerHTML=values.map((v,j)=>`<label>${j+1}위 ($)<input id="fine${j}" type="number" min="0" step="0.01" value="${v}" ${j===0||league==='공식경기'?'disabled':''}></label>`).join('')}function fields(){fineFields();if(isTeam($('mode').value)){let html='',m=$('mode').value,z=teamSize(m);for(let j=0;j<teamCount(m)*z;j++){if(j%z===0)html+='<h3>'+ ['A팀','B팀','C팀'][Math.floor(j/z)]+'</h3>';html+='<label>선수 '+(j%z+1)+' <select id="tm'+j+'">'+memberOptions(cfg.members?.[j]||Object.keys(roster)[j])+'</select><input id="guest'+j+'" placeholder="게스트 이름"></label>';if(j%z===z-1)html+='<label>팀 목표 <input id="g'+Math.floor(j/z)+'" type="number" min="1" value="20"></label>';} $('fields').innerHTML=html;return;}let m=$('mode').value;let n=+m||2;$('fields').innerHTML=Array.from({length:n},(_,j)=>{let name=cfg.names[j]||'';let known=!!roster[name];return `<label>선수 / 팀 ${j+1}<div class="name-row"><select id="pick${j}" onchange="pickMember(${j})">${memberOptions(name)}</select><input id="n${j}" aria-label="선수 이름 직접 입력" placeholder="게스트 / 팀 이름" value="${known?'':esc(name)}" style="display:${known?'none':'block'}"></div><input id="v${j}" aria-label="한글 발음" placeholder="한글 발음" value="${esc(cfg.pron[j]||roster[name]||name)}"><input id="g${j}" aria-label="목표 핸디 점수" type="number" min="1" value="${known?handicaps[name]:(cfg.goals[j]||20)}"></label>`}).join('');}
function pickMember(j){let name=$('pick'+j).value;let custom=$('n'+j);custom.style.display=name==='__guest'||!name?'block':'none';if(roster[name]){$('v'+j).value=roster[name];$('g'+j).value=handicaps[name]||20}else{custom.value='';$('v'+j).value='';$('g'+j).value=20}}
function memberEditor(){$('memberGrid').innerHTML=Object.keys(roster).map(n=>`<label for="hc${n}">${esc(n)}</label><input id="hc${n}" type="number" min="1" value="${handicaps[n]||20}">`).join('')}
function saveMembers(){Object.keys(roster).forEach(n=>handicaps[n]=Math.max(1,Math.floor(+$('hc'+n).value||20)));localStorage.bbHandicaps=JSON.stringify(handicaps);for(let j=0;j<(+$('mode').value||2);j++){let pick=$('pick'+j);if(pick&&roster[pick.value])$('g'+j).value=handicaps[pick.value]}alert('회원 핸디를 저장했어요. 다음 경기부터 자동 반영됩니다.')}

function newGame(){if($('league').value==='공식경기'&&$('mode').value!=='2'){alert('공식경기는 1:1만 가능합니다.');return;}let amounts=fineDefaults($('mode').value,$('league').value).map((v,j)=>{let x=$('fine'+j);return x.disabled?v:Number(x.value)});if(amounts.some(v=>!Number.isFinite(v)||v<0)){alert('벌금 금액을 확인하세요.');return;}if(isTeam($('mode').value)){startTeam(amounts);return;}let chosen=Array.from({length:+$('mode').value||2},(_,j)=>{let p=$('pick'+j).value;return roster[p]?p:$('n'+j).value.trim()});if(chosen.some(n=>!n)||new Set(chosen.map(n=>n.toLowerCase())).size!==chosen.length){alert('서로 다른 선수 이름을 모두 선택하세요.');return;}if(!s.done&&(s.p.some(Boolean)||s.i.some(Boolean)||s.time)&&!confirm('현재 경기를 지울까요?'))return;for(let k of ['kind','league','table','mode','voice'])cfg[k]=$(k).value;cfg.firstBall=$('firstBall').value;cfg.kind='3쿠션';cfg.limit=+$('limit').value;let n=+cfg.mode||2;cfg.names=Array.from({length:n},(_,j)=>{let picked=$('pick'+j).value;return roster[picked]?picked:($('n'+j).value.trim()||'Player '+(j+1))});cfg.pron=cfg.names.map((v,j)=>$('v'+j).value.trim()||roster[v]||v);cfg.goals=cfg.names.map((v,j)=>Math.max(1,Math.floor(+$('g'+j).value||20)));cfg.fines=amounts;s=fresh();h=[];running=false;$('setup').close();render()}function startTeam(amounts){let m=$('mode').value,z=teamSize(m),n=teamCount(m);let members=Array.from({length:n*z},(_,j)=>{let p=$('tm'+j).value;return roster[p]?p:$('guest'+j).value.trim()});if(members.some(n=>!n)||new Set(members.map(n=>n.toLowerCase())).size!==n*z){alert('서로 다른 선수 모두를 선택하세요.');return}if(!s.done&&(s.p.some(Boolean)||s.i.some(Boolean)||s.time)&&!confirm('현재 경기를 지울까요?'))return;for(let k of ['league','table','mode','voice'])cfg[k]=$(k).value;cfg.firstBall=$('firstBall').value;cfg.limit=+$('limit').value;cfg.members=members;cfg.names=Array.from({length:n},(_,t)=>members.slice(t*z,(t+1)*z).join(' / '));cfg.pron=cfg.names;cfg.goals=Array.from({length:n},(_,j)=>j).map(j=>Math.max(1,Math.floor(+$('g'+j).value||20)));cfg.fines=amounts;s=fresh();h=[];running=false;$('setup').close();render()}function teamStats(){return s.ts||(s.ts=Array.from({length:teamCount()*teamSize()},()=>({score:0,innings:0,highRun:0})))}function shooter(){return shooterFor(s.a)}function teamEnd(){if(teamMode()){let p=teamStats()[shooter()];p.innings++;p.highRun=Math.max(p.highRun,s.r)}}function individualData(){if(!teamMode())return undefined;return teamStats().map((p,j)=>{let active=!s.done&&shooter()===j&&s.r>0&&!ranks().includes(Math.floor(j/teamSize()));let innings=p.innings+Number(active);return {...p,name:cfg.members[j],innings,highRun:Math.max(p.highRun,active?s.r:0),average:innings?(p.score/innings).toFixed(3):'0.000',fine:(fineResult().find(f=>f.name===cfg.names[Math.floor(j/teamSize())])||{}).amount||0}})}function fineResult(){let order=multi()?ranks().slice():cfg.names.map((_,j)=>j).sort((a,b)=>Number(s.p[b]>=cfg.goals[b])-Number(s.p[a]>=cfg.goals[a]));if(multi()?order.length!==cfg.names.length:cfg.names.filter((_,j)=>s.p[j]>=cfg.goals[j]).length!==1)return [];let amounts=cfg.fines||fineDefaults(cfg.mode,cfg.league);return order.map((j,k)=>({name:cfg.names[j],rank:k+1,amount:amounts[k]||0,perPerson:true}))}function data(){return {members:teamMode()?cfg.members:undefined,individuals:individualData(),fines:fineResult(),fineSettings:cfg.fines||fineDefaults(cfg.mode,cfg.league),id:s.id,date:new Date().toISOString(),kind:cfg.kind,league:cfg.league,table:cfg.table,mode:cfg.mode,seconds:s.time,players:cfg.names.map((name,j)=>({name,goal:cfg.goals[j],score:s.p[j],innings:s.i[j],average:avg(j),highRun:Math.max(s.hr[j],s.a===j?s.r:0)})),ranking:ranks().map(j=>cfg.names[j]),winner:multi()?ranks().slice(0,1).map(j=>cfg.names[j]):cfg.names.filter((n,j)=>s.p[j]>=cfg.goals[j])}}function reportView(m){return baseReport(m)+(m.individuals?'<h3>개인 기록</h3>'+m.individuals.map(p=>'<p>'+esc(p.name)+' · '+p.score+'점 · AVG '+p.average+' · HR '+p.highRun+' · INN '+p.innings+' · $'+p.fine+'</p>').join(''):'')}function baseReport(m){let order=[...new Set([...(m.ranking||[]),...(m.winner||[]),...m.players.map(p=>p.name)])];return '<p>'+esc(m.kind)+' · '+esc(m.table)+' · '+esc(m.league)+'</p>'+order.map(name=>{let p=m.players.find(x=>x.name===name),f=(m.fines||[]).find(x=>x.name===name);return '<section style="border:1px solid #ccd8e5;border-radius:12px;padding:12px;margin:8px 0"><strong>'+(f?f.rank+'위 · ':'')+esc(name)+'</strong><h2>'+p.score+' / '+p.goal+'점</h2><p>에버리지 '+esc(p.average)+' · 하이런 '+p.highRun+' · 이닝 '+p.innings+'</p><p>'+(f?'벌금 $'+Number(f.amount).toFixed(2):'순위 미확정')+'</p></section>'}).join('')+'<p>총 벌금 $'+((m.fines||[]).reduce((a,x)=>a+Number(x.amount),0)*(isTeam(m.mode)?teamSize(m.mode):1)).toFixed(2)+'</p>'}function showFines(){} function result(){showFines();$('syncBtn').hidden=!s.done;$('report').innerHTML=reportView(data());$('finish').hidden=s.done;if(!$('out').open)$('out').showModal()}function finish(){if(s.done)return;if(!multi()&&!complete()){alert('승자가 확정되지 않았습니다.');return;}if(multi()){for(let j=0;j<cfg.names.length;j++)if(s.p[j]>=cfg.goals[j]&&!ranks().includes(j))ranks().push(j)}if(multi()&&ranks().length===cfg.names.length-1){ranks().push(cfg.names.findIndex((_,k)=>!ranks().includes(k)))}if(multi()&&ranks().length!==cfg.names.length){alert('마지막 한 명을 제외한 선수들의 순위가 확정되어야 합니다.');return;}if(!confirm('경기를 종료하고 저장할까요?'))return;if(s.r>0){teamEnd();s.finalInning=true;s.i[s.a]++;s.hr[s.a]=Math.max(s.hr[s.a],s.r)}s.r=0;s.done=true;running=false;saved.unshift(data());showFines();speak('경기가 종료되었습니다.');render();$('report').innerHTML=reportView(saved[0]);$('finish').hidden=true;$('syncBtn').hidden=false}function rematch(){if(!s.done&&!confirm('현재 경기를 초기화할까요?'))return;s=fresh();h=[];running=false;render()}function records(){$('fineReport').textContent='';$('syncBtn').hidden=true;$('report').innerHTML=saved.length?saved.map(m=>`<details><summary>${esc(new Date(m.date).toLocaleString('ko-KR',{timeZone:'Australia/Brisbane'}))} · ${esc(m.players.map(p=>p.name).join(' / '))}</summary>${reportView(m)}</details>`).join(''):'저장된 경기 없음';$('finish').hidden=true;$('out').showModal()}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved.length?saved:[data()],null,2)],{type:'application/json'}));a.download='billiards-records.json';a.click()}const syncURL='https://script.google.com/macros/s/AKfycbzcL6TuO7YnUqSgnABJhFnd8P7-CnLdqGIcyfVwQlM7ah7fXKs7yWXaRlN7nhgQ_uFXEg/exec';
function setSyncToken(){let t=prompt('연동 비밀번호를 입력하세요');if(t!==null){if(!t.trim()){localStorage.removeItem('bbSyncToken');return}localStorage.setItem('bbSyncToken',t.trim())}}
function queueRead(){try{return JSON.parse(localStorage.bbSyncQueue||'[]')}catch(e){return []}}
let syncing=false;
async function retrySync(){if(syncing)return;let q=queueRead();if(!q.length)return;let token=localStorage.bbSyncToken;if(!token){setSyncToken();token=localStorage.bbSyncToken}if(!token)return;syncing=true;try{for(const m of q){let res=await fetch(syncURL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'save',token,matchId:m.syncId,match:m})});let ans=await res.json();if(!ans.ok||ans.matchId!==m.syncId)throw Error(ans.message||'응답 오류');localStorage.bbSyncQueue=JSON.stringify(queueRead().filter(x=>x.syncId!==m.syncId));localStorage.setItem('bbSent:'+m.id,m.syncId)}alert('구글시트 전송 완료 (앱전송기록)')}catch(e){alert('전송 확인 실패. 기기에 보관했어요. 연결 후 재시도하세요. '+e.message)}finally{syncing=false}}
async function syncMatch(){let m=saved.find(x=>x.id===s.id);if(!m)return;if(localStorage.getItem('bbSent:'+m.id)){alert('이미 전송된 경기입니다.');return}if(m.winner.length!==1){alert('승자가 한 명인 경기만 전송할 수 있습니다.');return}let q=queueRead();if(!q.some(x=>x.id===m.id)){if(!confirm('이 경기 결과를 구글시트에 전송할까요?'))return;q.push({...m,syncId:crypto.randomUUID()});localStorage.bbSyncQueue=JSON.stringify(q)}await retrySync()}
window.addEventListener('online',()=>{if(queueRead().length&&localStorage.bbSyncToken)retrySync()});
